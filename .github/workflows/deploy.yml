name: Deploy Altbuilda Website

on:
  push:
    branches:
      - definity

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript Files
        run: tsc

      - name: Build project
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_MAIL_ADDRESS: ${{ secrets.VITE_MAIL_ADDRESS }}
          VITE_WEBSITE_URL: ${{ secrets.VITE_WEBSITE_URL }}
          VITE_ACTIV8_INSTAGRAM_URL: ${{ secrets.VITE_ACTIV8_INSTAGRAM_URL }}
          VITE_ACTIV8_TIKTOK_URL: ${{ secrets.VITE_ACTIV8_TIKTOK_URL }}
          VITE_ACTIV8_FACEBOOK_URL: ${{ secrets.VITE_ACTIV8_FACEBOOK_URL }}
          VITE_ACTIV8_X_URL: ${{ secrets.VITE_ACTIV8_X_URL }}
          VITE_ACTIV8_LINKEDIN_URL: ${{ secrets.VITE_ACTIV8_LINKEDIN_URL }}
          
        run: npm run build

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public_html/
          local-dir: ./dist/
